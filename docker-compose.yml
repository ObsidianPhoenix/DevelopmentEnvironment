# Please refer https://docs.docker.com/compose to learn more about Docker Compose.

networks: 

    DevelopmentNetwork:
        driver: bridge
services:

    # Bring up the latest SQL Server
    sql:
        container_name: sql
        user: root
        image: mcr.microsoft.com/azure-sql-edge:latest
        ports:
            - 1433:1433
            - 1431:1431
        volumes:
            - ~/SQL/Data:/sqldata
            - ~/SQL/SystemDbs:/var/opt/mssql/data
        environment:
            - ACCEPT_EULA=Y
            - SA_PASSWORD=letme!n123
            - MSSQL_DATA_DIR=/sqldata
            - MSSQL_LOG_DIR=/sqldata
        networks:
            - DevelopmentNetwork
        restart: unless-stopped
        healthcheck:
            test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "letme!n123" -Q "SELECT 1" -b -o /dev/null
            interval: 10s
            timeout: 3s
            retries: 10
            start_period: 10s
            
    # Bring up the latest redis container
    redis:
        container_name: redis
        image: redis:latest
        ports:
            # - 9000:6379
            - 6379:6379
        networks:
            - DevelopmentNetwork
        restart: unless-stopped
            
    # This is a web-based redis management tool. Access it on localhost:8081
    redis-commander:
        container_name: redis-commander
        image: rediscommander/redis-commander:latest
        environment: 
            - REDIS_HOSTS=local:redis:6379
        ports:
            - 8081:8081
        depends_on: 
            - redis
        networks:
            - DevelopmentNetwork
        restart: unless-stopped

    # rabbit:
