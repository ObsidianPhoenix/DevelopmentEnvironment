    # This is an emulator for Azure Blob Storage, Table and Queue services.
    # https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azurite?tabs=docker-hub%2Cblob-storage
    # https://hub.docker.com/r/microsoft/azure-storage-azurite
    # https://github.com/Azure/Azurite/blob/main/README.md#certificate-configuration-https
    azurite:
        container_name: azurite
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports: 
            - 10000:10000 # Blob
            - 10001:10001 # Queue
            - 10002:10002 # Table
        command: azurite -l /workspace -d /workspace/debug.log --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
        volumes:
          - ~/azurite:/workspace
        restart: unless-stopped

    asb-emulator:
        container_name: asb-emulator
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        ports:
            - 5672:5672
        volumes: 
            - ~/ASB/:/ServiceBus_Emulator/ConfigFiles
        environment:
            SQL_SERVER: sql
            MSSQL_SA_PASSWORD: letme!n123
            ACCEPT_EULA: Y
        depends_on:
            sql:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - DevelopmentNetwork

    cosmos:
        container_name: cosmos
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        ports:
            - 8081:8081
            - 10250:10250
            - 10251:10251
            - 10252:10252
            - 10253:10253
            - 10254:10254
            - 1234:1234
        environment:
            - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=1
            - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
            - PROTOCOL=http
            - ENABLE_EXPLORER=true
            - EXPLORER_PORT=1234
            - EXPLORER_PROTOCOL=http
        # volumes:
        #     - ~/CosmosDB:/data
        restart: unless-stopped
        networks:
            - DevelopmentNetwork